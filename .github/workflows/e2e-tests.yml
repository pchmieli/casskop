name: Run e2e tests

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

env:
  KUTTL_VERSION: 0.11.0

jobs:

  casskop-image:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '/kuttl-tests')
      )
    permissions:
      packages: write
    steps:
      - id: lower-repo
        shell: pwsh
        run: |
          "::set-output name=repository::$($env:GITHUB_REPOSITORY.ToLowerInvariant())"
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v1.14.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR branch name
        id: get-branch
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]
          then
            echo ::set-output name=branch::$(gh pr view ${{ github.event.issue.number }} --repo $REPO --json headRefName --jq '.headRefName')
          else
            echo ::set-output name=branch::${{ github.ref_name }}
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/casskop/Dockerfile
          tags: ghcr.io/${{ steps.lower-repo.outputs.repository }}:${{ steps.get-branch.outputs.branch }}
          push: true

  install-kuttl:
    needs: casskop-image
    runs-on: ubuntu-latest
    steps:
      - name: Cache Kuttl
        id: cache-kuttl
        uses: actions/cache@v4
        with:
          path: kuttl
          key: ${{ runner.os }}-kuttl-${{ env.KUTTL_VERSION }}

      - name: download-kuttl
        if: steps.cache-kuttl.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/kudobuilder/kuttl/releases/download/v${{ env.KUTTL_VERSION }}/kubectl-kuttl_${{ env.KUTTL_VERSION }}_linux_i386 -o kuttl

  kuttl-casskop:
    needs: install-kuttl
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        test-name: [storage-upsize]
    steps:
      - id: lower-repo
        shell: pwsh
        run: |
          "::set-output name=repository::$($env:GITHUB_REPOSITORY.ToLowerInvariant())"

      - name: Get PR branch name
        id: get-branch
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]
          then
            echo ::set-output name=branch::$(gh pr view ${{ github.event.issue.number }} --repo $REPO --json headRefName --jq '.headRefName')
          else
            echo ::set-output name=branch::${{ github.ref_name }}
          fi

      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.get-branch.outputs.branch }}

      - uses: rinx/setup-k3d@v0.0.4
        with:
          version: v5.4.0
          options: --image rancher/k3s:v1.24.13-k3s1 --k3s-arg --kubelet-arg=image-gc-high-threshold=85@server:0 --k3s-arg --kubelet-arg=image-gc-low-threshold=80@server:0 --k3s-arg --kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1%@server:0 --k3s-arg --kubelet-arg=eviction-minimum-reclaim=imagefs.available=5%,nodefs.available=5%@server:0 --k3s-arg --kubelet-arg=image-service-endpoint=unix:///run/k3s/containerd/containerd.sock@server:0

      - name: Wait for k3d cluster to be ready
        run: |
          echo "Waiting for k3d cluster to be ready..."
          # Wait for API server to be responsive
          for i in {1..60}; do
            if kubectl get nodes &>/dev/null; then
              echo "API server is responsive"
              break
            fi
            echo "Waiting for API server to be ready... ($i/60)"
            sleep 2
          done
          # Wait for nodes to be ready
          kubectl wait --for=condition=ready node --all --timeout=300s
          # Wait for kube-system namespace and core services to initialize
          for i in {1..30}; do
            if kubectl get pods -n kube-system &>/dev/null && kubectl get pods -n kube-system | grep -q Running; then
              echo "System pods are running"
              break
            fi
            echo "Waiting for system pods to start... ($i/30)"
            sleep 2
          done
          # Give the cluster additional time to stabilize
          sleep 15
          echo "Cluster is ready!"

      - name: Setup LVM on k3d cluster
        if: matrix.test-name == 'storage-upsize'
        run: |
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          NODE_CONTAINER=$(docker ps | grep server-0 | rev | awk '{print $1}' | rev)
          echo "Using node container: $NODE_CONTAINER"
          docker exec $NODE_CONTAINER df -h /
          echo "---"
          docker exec $NODE_CONTAINER df -h
          echo "------------------------------"
          echo "node capacity:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"
          
          kubectl apply -f test/setup/lvm-installer.yaml
          kubectl wait --for=condition=ready pod -l app=lvm-installer -n lvm-system --timeout=300s --all
          
          echo "========================================"
          echo "Verify LVM installer completed successfully"
          echo "LVM installer pods:"
          kubectl get pods -n lvm-system -l app=lvm-installer
          echo ""
          echo "LVM installer init container logs:"
          kubectl logs -n lvm-system daemonset/lvm-installer -c install-lvm-tools || echo "Failed to get install-lvm-tools logs"
          echo ""
          echo "LVM installer main container logs:"
          kubectl logs -n lvm-system daemonset/lvm-installer -c lvm-setup || echo "Failed to get lvm-setup logs"
          echo ""
          echo "Verify LVM volume group was created:"
          kubectl exec -n lvm-system daemonset/lvm-installer -c lvm-setup -- nsenter --mount=/proc/1/ns/mnt -- sh -c '
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            export PATH=/usr/local/sbin:/usr/local/bin:$PATH
            
            echo "=== Loop Devices ==="
            losetup -l || losetup -a || echo "losetup command failed"
            echo ""
            
            echo "=== Loop devices attached to disk.img ==="
            losetup -j /mnt/disks/disk.img || echo "No loop devices for disk.img found"
            LOOP_COUNT=$(losetup -j /mnt/disks/disk.img | wc -l)
            echo "Number of loop devices attached to disk.img: $LOOP_COUNT"
            if [ "$LOOP_COUNT" -gt 1 ]; then
              echo "❌ ERROR: Multiple loop devices detected for the same disk image!"
              echo "This will cause duplicate PV issues!"
            else
              echo "✅ Only one loop device attached to disk.img"
            fi
            echo ""
            
            echo "=== Volume Groups ==="
            vgs -v 2>&1
            echo ""
            
            echo "=== Physical Volumes ==="
            pvs -v 2>&1
            echo ""
            
            echo "=== Detailed PV scan (shows duplicates) ==="
            pvscan 2>&1
            echo ""
            
            echo "=== Checking for duplicate PV UUIDs ==="
            pvs --noheadings -o pv_name,pv_uuid 2>&1 | sort -k2 | uniq -d -f1 && echo "❌ DUPLICATE PV UUIDs DETECTED!" || echo "✅ No duplicate PV UUIDs"
            echo ""
          ' || echo "Failed to verify LVM setup"
          echo "========================================"
          
          # Validate no duplicate loop devices before proceeding
          echo ""
          echo "========================================"
          echo "VALIDATION: Checking for duplicate loop devices..."
          echo "========================================"
          VALIDATION_RESULT=$(kubectl exec -n lvm-system daemonset/lvm-installer -c lvm-setup -- nsenter --mount=/proc/1/ns/mnt -- sh -c '
            LOOP_COUNT=$(losetup -j /mnt/disks/disk.img 2>/dev/null | wc -l || echo "0")
            echo "Loop devices attached to disk.img: $LOOP_COUNT"
            losetup -j /mnt/disks/disk.img 2>&1 || echo "No loop devices"
            
            if [ "$LOOP_COUNT" -gt 1 ]; then
              echo "❌ VALIDATION FAILED: Multiple loop devices detected!"
              echo "This will cause OpenEBS provisioning to fail with duplicate PV error."
              exit 1
            else
              echo "✅ VALIDATION PASSED: Only one loop device"
              exit 0
            fi
          ' 2>&1) || VALIDATION_EXIT_CODE=$?
          
          echo "$VALIDATION_RESULT"
          
          if [ "${VALIDATION_EXIT_CODE:-0}" -ne 0 ]; then
            echo ""
            echo "❌❌❌ CRITICAL ERROR ❌❌❌"
            echo "Duplicate loop devices detected!"
            echo "The lvm-installer fix did not work as expected."
            echo "Cannot proceed with OpenEBS installation."
            echo ""
            echo "Showing detailed diagnostics..."
            kubectl exec -n lvm-system daemonset/lvm-installer -c lvm-setup -- nsenter --mount=/proc/1/ns/mnt -- sh -c '
              export PATH=/usr/local/sbin:/usr/local/bin:$PATH
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
              echo "All loop devices:"
              losetup -l || losetup -a
              echo ""
              echo "PV scan:"
              pvscan
              echo ""
              echo "All PVs with UUIDs:"
              pvs -o pv_name,pv_uuid
            ' || true
            exit 1
          fi
          echo "========================================"
          echo ""
          
          # Restart k3s to ensure kubelet picks up proper disk capacity
          echo "Restarting k3s to refresh disk capacity detection..."
          docker exec $NODE_CONTAINER sh -c 'kill -HUP 1' || true
          
          # Wait for k3s to come back up
          echo "Waiting for cluster to stabilize after restart..."
          sleep 30
          kubectl wait --for=condition=ready node --all --timeout=300s
          
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          NODE_CONTAINER=$(docker ps | grep server-0 | rev | awk '{print $1}' | rev)
          echo "Using node container: $NODE_CONTAINER"
          docker exec $NODE_CONTAINER df -h /
          echo "---"
          docker exec $NODE_CONTAINER df -h
          echo "------------------------------"
          echo "node capacity:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"

      - name: Install OpenEBS LVM LocalPV
        if: matrix.test-name == 'storage-upsize'
        run: |
          echo "Downloading OpenEBS LVM operator manifest..."
          curl -sL https://openebs.github.io/charts/lvm-operator.yaml -o /tmp/openebs-lvm-operator.yaml
          
          echo "Removing Bidirectional mount propagation for k3d compatibility..."
          sed -i '/mountPropagation: "Bidirectional"/d' /tmp/openebs-lvm-operator.yaml
          
          echo "Installing OpenEBS LVM operator..."
          kubectl apply -f /tmp/openebs-lvm-operator.yaml
          
          echo "Waiting for OpenEBS LVM controller to be ready..."
          kubectl wait --for=condition=ready pod -l app=openebs-lvm-controller -n kube-system --timeout=300s
          
          echo "Waiting for OpenEBS LVM node daemonset to be ready..."
          kubectl rollout status daemonset/openebs-lvm-node -n kube-system --timeout=300s
          
          echo "OpenEBS LVM components:"
          kubectl get pods -n kube-system -l app=openebs-lvm-controller
          kubectl get pods -n kube-system -l app=openebs-lvm-node
          
          echo ""
          echo "=============================="
          echo "FINAL DIAGNOSTICS"
          echo "=============================="
          echo ""
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          NODE_CONTAINER=$(docker ps | grep server-0 | rev | awk '{print $1}' | rev)
          echo "Using node container: $NODE_CONTAINER"
          docker exec $NODE_CONTAINER df -h /
          echo "---"
          docker exec $NODE_CONTAINER df -h
          echo "------------------------------"
          echo "node capacity and allocatable:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"
          echo "node conditions:"
          kubectl get nodes -o json | jq '.items[].status.conditions'
          echo "------------------------------"
          echo "kubelet config (image filesystem):"
          docker exec $NODE_CONTAINER cat /var/lib/rancher/k3s/agent/etc/kubelet.config 2>/dev/null || echo "kubelet config not accessible"
          echo "------------------------------"
          echo "LVM volume groups:"
          docker exec $NODE_CONTAINER sh -c 'export PATH=/usr/local/sbin:$PATH; export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH; vgs' || echo "vgs command failed"
          echo "------------------------------"
          echo "LVM physical volumes:"
          docker exec $NODE_CONTAINER sh -c 'export PATH=/usr/local/sbin:$PATH; export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH; pvs' || echo "pvs command failed"
          echo "------------------------------"
          echo "Loop devices in node:"
          docker exec $NODE_CONTAINER losetup -l || docker exec $NODE_CONTAINER losetup -a || echo "losetup failed"
          echo "------------------------------"
          echo "Loop devices attached to disk.img:"
          docker exec $NODE_CONTAINER losetup -j /mnt/disks/disk.img || echo "No loop devices for disk.img"
          LOOP_COUNT=$(docker exec $NODE_CONTAINER losetup -j /mnt/disks/disk.img | wc -l || echo "0")
          echo "Number of loop devices for disk.img: $LOOP_COUNT"
          if [ "$LOOP_COUNT" -gt 1 ]; then
            echo "❌ WARNING: Multiple loop devices detected!"
          fi
          echo "------------------------------"
          echo "Verify OpenEBS can see LVM (from openebs-lvm-plugin container):"
          kubectl exec -n kube-system daemonset/openebs-lvm-node -c openebs-lvm-plugin -- vgs || echo "OpenEBS cannot see VGs - this is the problem!"
          kubectl exec -n kube-system daemonset/openebs-lvm-node -c openebs-lvm-plugin -- pvs || echo "OpenEBS cannot see PVs"
          echo ""
          echo "Checking for duplicate PV detection by OpenEBS:"
          kubectl exec -n kube-system daemonset/openebs-lvm-node -c openebs-lvm-plugin -- sh -c 'pvs --noheadings -o pv_name,pv_uuid 2>&1; pvscan 2>&1' || echo "Failed to check PVs from OpenEBS"
          echo "------------------------------"
          echo "Storage classes:"
          kubectl get sc
          echo "------------------------------"

      - name: Start background pod diagnostics
        if: matrix.test-name == 'storage-upsize'
        run: |
          # Start background monitoring script
          nohup bash -c '
            sleep 10
            for i in {1..60}; do
              echo "=== Diagnostics check $i at $(date) ==="
              echo ""
              echo "--- Cassandra pods ---"
              kubectl get pods -l app=cassandra -o wide 2>/dev/null || echo "No cassandra pods yet"
              echo ""
              echo "--- Cassandra pod details (if exists) ---"
              POD=$(kubectl get pod cassandra-e2e-dc1-rack1-0 -o name 2>/dev/null)
              if [ -n "$POD" ]; then
                echo "Pod status:"
                kubectl get pod cassandra-e2e-dc1-rack1-0 -o json | jq ".status.conditions, .status.containerStatuses"
                echo ""
                echo "Pod events:"
                kubectl describe pod cassandra-e2e-dc1-rack1-0 | tail -n 30
              fi
              echo ""
              echo "--- PVC status ---"
              kubectl get pvc data-cassandra-e2e-dc1-rack1-0 2>/dev/null || echo "PVC not created yet"
              echo ""
              echo "--- PV status ---"
              kubectl get pv 2>/dev/null || echo "No PVs yet"
              echo ""
              echo "--- Node conditions ---"
              kubectl get nodes -o json | jq ".items[].status.conditions[] | select(.type==\"Ready\" or .type==\"DiskPressure\" or .type==\"MemoryPressure\")"
              echo ""
              echo "--- Node capacity ---"
              kubectl get nodes -o json | jq ".items[] | {name: .metadata.name, capacity: .status.capacity, allocatable: .status.allocatable}"
              echo ""
              echo "--- Recent events ---"
              kubectl get events --sort-by=.metadata.creationTimestamp | tail -n 10
              echo ""
              echo "========================================"
              echo ""
              sleep 20
            done
          ' > /tmp/diagnostics.log 2>&1 &
          echo "Background diagnostics started with PID $!"
          echo "Logs will be in /tmp/diagnostics.log"

      - name: Restore Kuttl
        id: cache-kuttl
        uses: actions/cache@v4
        with:
          path: kuttl
          key: ${{ runner.os }}-kuttl-${{ env.KUTTL_VERSION }}

      - name: Add aws-backup-secrets with S3
        if: matrix.test-name == 'backup-restore'
        working-directory: test/kuttl
        run: |
          cat <<EOF >> backup-restore/00-createCluster.yaml
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-backup-secrets
          type: Opaque
          stringData:
            awsaccesskeyid: ${{ secrets.AWS_ACCESS_KEY_ID }}
            awssecretaccesskey: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            awsregion: us-west-2
          EOF

          cat <<EOF >> backup-restore/00-assert.yaml
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-backup-secrets
          EOF

      - name: Run kuttl tests
        run: |
          chmod u+x kuttl
          PATH=$PWD:$PATH
          helm install casskop charts/casskop --set image.tag=${{ steps.get-branch.outputs.branch }} --set image.repository=ghcr.io/${{ steps.lower-repo.outputs.repository }}
          cd test/kuttl/
          kuttl test --test ${{ matrix.test-name }} --namespace default --skip-delete

      - name: Dump background diagnostics
        if: matrix.test-name == 'storage-upsize' && always()
        run: |
          echo "========================================"
          echo "BACKGROUND DIAGNOSTICS LOG"
          echo "========================================"
          if [ -f /tmp/diagnostics.log ]; then
            cat /tmp/diagnostics.log
          else
            echo "No diagnostics log found"
          fi
          echo "========================================"
          echo "FINAL STATE"
          echo "========================================"
          echo "All pods:"
          kubectl get pods --all-namespaces -o wide
          echo ""
          echo "All PVCs:"
          kubectl get pvc --all-namespaces
          echo ""
          echo "All PVs:"
          kubectl get pv
          echo ""
          echo "All events:"
          kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp
          echo ""
          echo "Node describe:"
          kubectl describe nodes
          
          echo "========================================"
          echo "Check LVM installer logs"
          echo "LVM installer pods:"
          kubectl get pods -n lvm-system -l app=lvm-installer || echo "No lvm-installer pods found"
          echo ""
          echo "LVM installer init container logs (install-lvm-tools):"
          kubectl logs -n lvm-system daemonset/lvm-installer -c install-lvm-tools || echo "Failed to get install-lvm-tools logs"
          echo ""
          echo "LVM installer main container logs (lvm-setup):"
          kubectl logs -n lvm-system daemonset/lvm-installer -c lvm-setup || echo "Failed to get lvm-setup logs"
          echo ""
          echo "Verify LVM setup from lvm-installer container:"
          kubectl exec -n lvm-system daemonset/lvm-installer -c lvm-setup -- nsenter --mount=/proc/1/ns/mnt -- sh -c '
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            export PATH=/usr/local/sbin:/usr/local/bin:$PATH
            
            echo "=== All Loop Devices ==="
            losetup -l 2>&1 || losetup -a 2>&1 || echo "losetup failed"
            echo ""
            
            echo "=== Loop devices for disk.img ==="
            losetup -j /mnt/disks/disk.img 2>&1 || echo "No loop devices"
            LOOP_COUNT=$(losetup -j /mnt/disks/disk.img 2>/dev/null | wc -l || echo "0")
            echo "Count: $LOOP_COUNT"
            if [ "$LOOP_COUNT" -gt 1 ]; then
              echo "❌ ERROR: Multiple loop devices detected - this causes duplicate PV issue!"
            fi
            echo ""
            
            echo "VGs:"
            vgs -v 2>&1
            echo ""
            
            echo "PVs:"
            pvs -v 2>&1
            echo ""
            
            echo "PV Scan (shows all detected PVs including duplicates):"
            pvscan 2>&1
            echo ""
            
            echo "Checking for duplicate PV UUIDs:"
            pvs --noheadings -o pv_name,pv_uuid 2>&1
            echo ""
            
            echo "LVs:"
            lvs 2>&1 || echo "No LVs yet"
          ' || echo "Failed to verify LVM from lvm-installer"
          
          echo "========================================"
          echo "Check LVM controller logs"
          kubectl logs -n kube-system deployment/openebs-lvm-controller || kubectl logs -n kube-system pods/openebs-lvm-controller-0 || echo "Failed to get LVM controller logs"
          
          echo "========================================"
          echo "Check LVM node logs"
          echo "LVM node pods:"
          kubectl get pods -n kube-system -l app=openebs-lvm-node || echo "No LVM node pods found"
          echo ""
          echo "LVM node plugin logs (openebs-lvm-plugin container):"
          kubectl logs -n kube-system daemonset/openebs-lvm-node -c openebs-lvm-plugin || echo "Failed to get openebs-lvm-plugin logs"
          echo ""
          echo "LVM node registrar logs (csi-node-driver-registrar container):"
          kubectl logs -n kube-system daemonset/openebs-lvm-node -c csi-node-driver-registrar || echo "Failed to get csi-node-driver-registrar logs"
          
          echo "========================================"
          echo "Verify LVM volume group exists and has space"
          echo "Check LVM volume group - specify the openebs-lvm-plugin container"
          kubectl exec -n kube-system daemonset/openebs-lvm-node -c openebs-lvm-plugin -- vgs
          echo "====="
          echo "Check physical volumes"
          kubectl exec -n kube-system daemonset/openebs-lvm-node -c openebs-lvm-plugin -- pvs
          echo "====="
          echo "Check logical volumes"
          kubectl exec -n kube-system daemonset/openebs-lvm-node -c openebs-lvm-plugin -- lvs
          echo "====="
          
          echo "========================================"
          echo "Check the storage class configuration"
          kubectl get sc openebs-lvm-sc -o yaml

