name: Run e2e tests

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

env:
  KUTTL_VERSION: 0.11.0

jobs:

  casskop-image:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '/kuttl-tests')
      )
    permissions:
      packages: write
    steps:
      - id: lower-repo
        shell: pwsh
        run: |
          "::set-output name=repository::$($env:GITHUB_REPOSITORY.ToLowerInvariant())"
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v1.14.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR branch name
        id: get-branch
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]
          then
            echo ::set-output name=branch::$(gh pr view ${{ github.event.issue.number }} --repo $REPO --json headRefName --jq '.headRefName')
          else
            echo ::set-output name=branch::${{ github.ref_name }}
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/casskop/Dockerfile
          tags: ghcr.io/${{ steps.lower-repo.outputs.repository }}:${{ steps.get-branch.outputs.branch }}
          push: true

  install-kuttl:
    needs: casskop-image
    runs-on: ubuntu-latest
    steps:
      - name: Cache Kuttl
        id: cache-kuttl
        uses: actions/cache@v4
        with:
          path: kuttl
          key: ${{ runner.os }}-kuttl-${{ env.KUTTL_VERSION }}

      - name: download-kuttl
        if: steps.cache-kuttl.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/kudobuilder/kuttl/releases/download/v${{ env.KUTTL_VERSION }}/kubectl-kuttl_${{ env.KUTTL_VERSION }}_linux_i386 -o kuttl

  kuttl-casskop:
    needs: install-kuttl
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        test-name: [storage-upsize]
    steps:
      - id: lower-repo
        shell: pwsh
        run: |
          "::set-output name=repository::$($env:GITHUB_REPOSITORY.ToLowerInvariant())"

      - name: Get PR branch name
        id: get-branch
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]
          then
            echo ::set-output name=branch::$(gh pr view ${{ github.event.issue.number }} --repo $REPO --json headRefName --jq '.headRefName')
          else
            echo ::set-output name=branch::${{ github.ref_name }}
          fi

      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.get-branch.outputs.branch }}

      - uses: rinx/setup-k3d@v0.0.4
        with:
          version: v5.4.0
          options: --image rancher/k3s:v1.24.13-k3s1

      - name: Wait for k3d cluster to be ready
        run: |
          echo "Waiting for k3d cluster to be ready..."
          # Wait for API server to be responsive
          for i in {1..60}; do
            if kubectl get nodes &>/dev/null; then
              echo "API server is responsive"
              break
            fi
            echo "Waiting for API server to be ready... ($i/60)"
            sleep 2
          done
          # Wait for nodes to be ready
          kubectl wait --for=condition=ready node --all --timeout=300s
          # Wait for kube-system namespace and core services to initialize
          for i in {1..30}; do
            if kubectl get pods -n kube-system &>/dev/null && kubectl get pods -n kube-system | grep -q Running; then
              echo "System pods are running"
              break
            fi
            echo "Waiting for system pods to start... ($i/30)"
            sleep 2
          done
          # Give the cluster additional time to stabilize
          sleep 15
          echo "Cluster is ready!"

      - name: Setup LVM on k3d cluster
        if: matrix.test-name == 'storage-upsize'
        run: |
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          docker exec k3d-k3s-default-server-0 df -h /
          echo "---"
          docker exec k3d-k3s-default-server-0 df -h
          echo "------------------------------"
          echo "node capacity:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"
          
          kubectl apply -f test/setup/lvm-installer.yaml
          kubectl wait --for=condition=ready pod -l app=lvm-installer -n lvm-system --timeout=300s --all
          
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          docker exec k3d-k3s-default-server-0 df -h /
          echo "---"
          docker exec k3d-k3s-default-server-0 df -h
          echo "------------------------------"
          echo "node capacity:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"

      - name: Install OpenEBS LVM LocalPV
        if: matrix.test-name == 'storage-upsize'
        run: |
          kubectl apply -f https://openebs.github.io/charts/lvm-operator.yaml
          # TODO: maybe bidirectional mount propagation need to be disabled
          #kubectl wait --for=condition=ready pod -l app=openebs-lvm-controller -n kube-system --timeout=300s
          #kubectl rollout status daemonset/openebs-lvm-node -n kube-system --timeout=300s
          sleep 180
          kubectl get pods -n kube-system -l app=openebs-lvm-controller
          
          POD_NAME=$(kubectl get pods -n kube-system -l app=openebs-lvm-controller -o jsonpath='{.items[0].metadata.name}')
          kubectl describe pod $POD_NAME -n kube-system
          
          kubectl wait --for=condition=ready pod -l app=openebs-lvm-controller -n kube-system --timeout=10s
          
          #TODO: clean that step

      - name: Restore Kuttl
        id: cache-kuttl
        uses: actions/cache@v4
        with:
          path: kuttl
          key: ${{ runner.os }}-kuttl-${{ env.KUTTL_VERSION }}

      - name: Add aws-backup-secrets with S3
        if: matrix.test-name == 'backup-restore'
        working-directory: test/kuttl
        run: |
          cat <<EOF >> backup-restore/00-createCluster.yaml
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-backup-secrets
          type: Opaque
          stringData:
            awsaccesskeyid: ${{ secrets.AWS_ACCESS_KEY_ID }}
            awssecretaccesskey: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            awsregion: us-west-2
          EOF

          cat <<EOF >> backup-restore/00-assert.yaml
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-backup-secrets
          EOF

      - name: Run kuttl tests
        run: |
          chmod u+x kuttl
          PATH=$PWD:$PATH
          helm install casskop charts/casskop --set image.tag=${{ steps.get-branch.outputs.branch }} --set image.repository=ghcr.io/${{ steps.lower-repo.outputs.repository }}
          cd test/kuttl/
          kuttl test --test ${{ matrix.test-name }} --namespace default --skip-delete
