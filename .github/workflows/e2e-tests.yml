name: Run e2e tests

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

env:
  KUTTL_VERSION: 0.11.0

jobs:

  casskop-image:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '/kuttl-tests')
      )
    permissions:
      packages: write
    steps:
      - id: lower-repo
        shell: pwsh
        run: |
          "::set-output name=repository::$($env:GITHUB_REPOSITORY.ToLowerInvariant())"
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v1.14.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR branch name
        id: get-branch
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]
          then
            echo ::set-output name=branch::$(gh pr view ${{ github.event.issue.number }} --repo $REPO --json headRefName --jq '.headRefName')
          else
            echo ::set-output name=branch::${{ github.ref_name }}
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/casskop/Dockerfile
          tags: ghcr.io/${{ steps.lower-repo.outputs.repository }}:${{ steps.get-branch.outputs.branch }}
          push: true

  install-kuttl:
    needs: casskop-image
    runs-on: ubuntu-latest
    steps:
      - name: Cache Kuttl
        id: cache-kuttl
        uses: actions/cache@v4
        with:
          path: kuttl
          key: ${{ runner.os }}-kuttl-${{ env.KUTTL_VERSION }}

      - name: download-kuttl
        if: steps.cache-kuttl.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/kudobuilder/kuttl/releases/download/v${{ env.KUTTL_VERSION }}/kubectl-kuttl_${{ env.KUTTL_VERSION }}_linux_i386 -o kuttl

  kuttl-casskop:
    needs: install-kuttl
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        test-name: [storage-upsize]
    steps:
      - id: lower-repo
        shell: pwsh
        run: |
          "::set-output name=repository::$($env:GITHUB_REPOSITORY.ToLowerInvariant())"

      - name: Get PR branch name
        id: get-branch
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]
          then
            echo ::set-output name=branch::$(gh pr view ${{ github.event.issue.number }} --repo $REPO --json headRefName --jq '.headRefName')
          else
            echo ::set-output name=branch::${{ github.ref_name }}
          fi

      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.get-branch.outputs.branch }}

      - uses: rinx/setup-k3d@v0.0.4
        with:
          version: v5.4.0
          options: --image rancher/k3s:v1.24.13-k3s1 --k3s-arg --kubelet-arg=image-gc-high-threshold=85@server:0 --k3s-arg --kubelet-arg=image-gc-low-threshold=80@server:0 --k3s-arg --kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1%@server:0 --k3s-arg --kubelet-arg=eviction-minimum-reclaim=imagefs.available=5%,nodefs.available=5%@server:0 --k3s-arg --kubelet-arg=image-service-endpoint=unix:///run/k3s/containerd/containerd.sock@server:0

      - name: Wait for k3d cluster to be ready
        run: |
          echo "Waiting for k3d cluster to be ready..."
          # Wait for API server to be responsive
          for i in {1..60}; do
            if kubectl get nodes &>/dev/null; then
              echo "API server is responsive"
              break
            fi
            echo "Waiting for API server to be ready... ($i/60)"
            sleep 2
          done
          # Wait for nodes to be ready
          kubectl wait --for=condition=ready node --all --timeout=300s
          # Wait for kube-system namespace and core services to initialize
          for i in {1..30}; do
            if kubectl get pods -n kube-system &>/dev/null && kubectl get pods -n kube-system | grep -q Running; then
              echo "System pods are running"
              break
            fi
            echo "Waiting for system pods to start... ($i/30)"
            sleep 2
          done
          # Give the cluster additional time to stabilize
          sleep 15
          echo "Cluster is ready!"

      - name: Setup LVM on k3d cluster
        if: matrix.test-name == 'storage-upsize'
        run: |
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          NODE_CONTAINER=$(docker ps | grep server-0 | rev | awk '{print $1}' | rev)
          echo "Using node container: $NODE_CONTAINER"
          docker exec $NODE_CONTAINER df -h /
          echo "---"
          docker exec $NODE_CONTAINER df -h
          echo "------------------------------"
          echo "node capacity:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"
          
          kubectl apply -f test/setup/lvm-installer.yaml
          kubectl wait --for=condition=ready pod -l app=lvm-installer -n lvm-system --timeout=300s --all
          
          # Restart k3s to ensure kubelet picks up proper disk capacity
          echo "Restarting k3s to refresh disk capacity detection..."
          docker exec $NODE_CONTAINER sh -c 'kill -HUP 1' || true
          
          # Wait for k3s to come back up
          echo "Waiting for cluster to stabilize after restart..."
          sleep 30
          kubectl wait --for=condition=ready node --all --timeout=300s
          
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          NODE_CONTAINER=$(docker ps | grep server-0 | rev | awk '{print $1}' | rev)
          echo "Using node container: $NODE_CONTAINER"
          docker exec $NODE_CONTAINER df -h /
          echo "---"
          docker exec $NODE_CONTAINER df -h
          echo "------------------------------"
          echo "node capacity:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"

      - name: Install OpenEBS LVM LocalPV
        if: matrix.test-name == 'storage-upsize'
        run: |
          echo "Downloading OpenEBS LVM operator manifest..."
          curl -sL https://openebs.github.io/charts/lvm-operator.yaml -o /tmp/openebs-lvm-operator.yaml
          
          echo "Removing Bidirectional mount propagation for k3d compatibility..."
          sed -i '/mountPropagation: "Bidirectional"/d' /tmp/openebs-lvm-operator.yaml
          
          echo "Installing OpenEBS LVM operator..."
          kubectl apply -f /tmp/openebs-lvm-operator.yaml
          
          echo "Waiting for OpenEBS LVM controller to be ready..."
          kubectl wait --for=condition=ready pod -l app=openebs-lvm-controller -n kube-system --timeout=300s
          
          echo "Waiting for OpenEBS LVM node daemonset to be ready..."
          kubectl rollout status daemonset/openebs-lvm-node -n kube-system --timeout=300s
          
          echo "OpenEBS LVM components:"
          kubectl get pods -n kube-system -l app=openebs-lvm-controller
          
          echo ""
          echo "=============================="
          echo "FINAL DIAGNOSTICS"
          echo "=============================="
          echo ""
          echo "host filesystem:"
          df -h /
          echo "---"
          df -h
          echo "------------------------------"
          echo "node filesystem:"
          NODE_CONTAINER=$(docker ps | grep server-0 | rev | awk '{print $1}' | rev)
          echo "Using node container: $NODE_CONTAINER"
          docker exec $NODE_CONTAINER df -h /
          echo "---"
          docker exec $NODE_CONTAINER df -h
          echo "------------------------------"
          echo "node capacity and allocatable:"
          kubectl describe nodes | grep -A 15 "Capacity:"
          echo "------------------------------"
          echo "node conditions:"
          kubectl get nodes -o json | jq '.items[].status.conditions'
          echo "------------------------------"
          echo "kubelet config (image filesystem):"
          docker exec $NODE_CONTAINER cat /var/lib/rancher/k3s/agent/etc/kubelet.config 2>/dev/null || echo "kubelet config not accessible"
          echo "------------------------------"
          echo "LVM volume groups:"
          docker exec $NODE_CONTAINER sh -c 'export PATH=/usr/local/sbin:$PATH; export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH; vgs' || echo "vgs command failed"
          echo "------------------------------"
          echo "Storage classes:"
          kubectl get sc
          echo "------------------------------"

      - name: Start background pod diagnostics
        if: matrix.test-name == 'storage-upsize'
        run: |
          # Start background monitoring script
          nohup bash -c '
            sleep 10
            for i in {1..60}; do
              echo "=== Diagnostics check $i at $(date) ==="
              echo ""
              echo "--- Cassandra pods ---"
              kubectl get pods -l app=cassandra -o wide 2>/dev/null || echo "No cassandra pods yet"
              echo ""
              echo "--- Cassandra pod details (if exists) ---"
              POD=$(kubectl get pod cassandra-e2e-dc1-rack1-0 -o name 2>/dev/null)
              if [ -n "$POD" ]; then
                echo "Pod status:"
                kubectl get pod cassandra-e2e-dc1-rack1-0 -o json | jq ".status.conditions, .status.containerStatuses"
                echo ""
                echo "Pod events:"
                kubectl describe pod cassandra-e2e-dc1-rack1-0 | tail -n 30
              fi
              echo ""
              echo "--- PVC status ---"
              kubectl get pvc data-cassandra-e2e-dc1-rack1-0 2>/dev/null || echo "PVC not created yet"
              echo ""
              echo "--- PV status ---"
              kubectl get pv 2>/dev/null || echo "No PVs yet"
              echo ""
              echo "--- Node conditions ---"
              kubectl get nodes -o json | jq ".items[].status.conditions[] | select(.type==\"Ready\" or .type==\"DiskPressure\" or .type==\"MemoryPressure\")"
              echo ""
              echo "--- Node capacity ---"
              kubectl get nodes -o json | jq ".items[] | {name: .metadata.name, capacity: .status.capacity, allocatable: .status.allocatable}"
              echo ""
              echo "--- Recent events ---"
              kubectl get events --sort-by=.metadata.creationTimestamp | tail -n 10
              echo ""
              echo "========================================"
              echo ""
              sleep 20
            done
          ' > /tmp/diagnostics.log 2>&1 &
          echo "Background diagnostics started with PID $!"
          echo "Logs will be in /tmp/diagnostics.log"

      - name: Restore Kuttl
        id: cache-kuttl
        uses: actions/cache@v4
        with:
          path: kuttl
          key: ${{ runner.os }}-kuttl-${{ env.KUTTL_VERSION }}

      - name: Add aws-backup-secrets with S3
        if: matrix.test-name == 'backup-restore'
        working-directory: test/kuttl
        run: |
          cat <<EOF >> backup-restore/00-createCluster.yaml
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-backup-secrets
          type: Opaque
          stringData:
            awsaccesskeyid: ${{ secrets.AWS_ACCESS_KEY_ID }}
            awssecretaccesskey: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            awsregion: us-west-2
          EOF

          cat <<EOF >> backup-restore/00-assert.yaml
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-backup-secrets
          EOF

      - name: Run kuttl tests
        run: |
          chmod u+x kuttl
          PATH=$PWD:$PATH
          helm install casskop charts/casskop --set image.tag=${{ steps.get-branch.outputs.branch }} --set image.repository=ghcr.io/${{ steps.lower-repo.outputs.repository }}
          cd test/kuttl/
          kuttl test --test ${{ matrix.test-name }} --namespace default --skip-delete

      - name: Dump background diagnostics
        if: matrix.test-name == 'storage-upsize' && always()
        run: |
          echo "========================================"
          echo "BACKGROUND DIAGNOSTICS LOG"
          echo "========================================"
          if [ -f /tmp/diagnostics.log ]; then
            cat /tmp/diagnostics.log
          else
            echo "No diagnostics log found"
          fi
          echo "========================================"
          echo "FINAL STATE"
          echo "========================================"
          echo "All pods:"
          kubectl get pods --all-namespaces -o wide
          echo ""
          echo "All PVCs:"
          kubectl get pvc --all-namespaces
          echo ""
          echo "All PVs:"
          kubectl get pv
          echo ""
          echo "All events:"
          kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp
          echo ""
          echo "Node describe:"
          kubectl describe nodes

