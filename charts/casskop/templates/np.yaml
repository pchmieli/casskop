apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: casskop-to-cassandra
  namespace: default  # Where CassKop runs
spec:
  podSelector:
    matchLabels:
      app: casskop  # Your operator label
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}  # All namespaces
          podSelector:
            matchLabels:
              app: cassandracluster  # Cassandra pod labels
      ports:
        - protocol: TCP
          port: 9042  # CQL
        - protocol: TCP
          port: 8778  # Jolokia
        - protocol: TCP
          port: 7199  # JMX
    - to:  # Allow DNS
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53