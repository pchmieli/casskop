apiVersion: v1
kind: ServiceAccount
metadata:
  name: cassandra-cluster-node
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: casskop-cluster-node-{{ .Namespace }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Namespace }}
    name: casskop-cluster-node
roleRef:
  kind: ClusterRole
  name: casskop-cluster-node
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-v1
data:
  pre_run.sh: |-
    echo example1
---
apiVersion: db.orange.com/v2
kind: CassandraCluster
metadata:
  name: cassandra-e2e
spec:
  nodesPerRacks: 2
  cassandraImage: cassandra:3.11.19
  configMapName: configmap-v1
  autoPilot: true
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
  topology:
    dc:
      - name: dc1
        rack:
          - name: rack1
