apiVersion: v1
kind: ServiceAccount
metadata:
  name: cassandra-cluster-node
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: casskop-cluster-node-{{ .Namespace }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Namespace }}
    name: casskop-cluster-node
roleRef:
  kind: ClusterRole
  name: casskop-cluster-node
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: db.orange.com/v2
kind: CassandraCluster
metadata:
  name: cassandra-e2e
spec:
  nodesPerRacks: 1
  cassandraImage: cassandra:3.11.19
  dataCapacity: "256Mi"
  deletePVC: true
  autoPilot: true
  autoUpdateSeedList: true
  dataStorageClass: local-path
  resources:
    limits:
      memory: 512Mi
      cpu: 200m
  topology:
    dc:
      - name: dc1
        rack:
          - name: rack1
