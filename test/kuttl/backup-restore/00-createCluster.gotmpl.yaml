apiVersion: v1
kind: ServiceAccount
metadata:
  name: cassandra-cluster-node
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: casskop-cluster-node-{{ .Namespace }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Namespace }}
    name: casskop-cluster-node
roleRef:
  kind: ClusterRole
  name: casskop-cluster-node
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: db.orange.com/v2
kind: CassandraCluster
metadata:
  name: cassandra-e2e
spec:
  nodesPerRacks: 2
  cassandraImage: cassandra:3.11.19
  bootstrapImage: ghcr.io/cscetbon/casskop-bootstrap:0.1.21
  dataCapacity: 256Mi
  hardAntiAffinity: false
  deletePVC: true
  autoPilot: true
  autoUpdateSeedList: false
  dataStorageClass: local-path
  resources:
    limits:
      memory: 768Mi
      cpu: 200m
  topology:
    dc:
      - name: dc1
        rack:
          - name: rack1
  backRestSidecar:
    image: ghcr.io/cscetbon/instaclustr-icarus:1.1.3
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
