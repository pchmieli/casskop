apiVersion: v1
kind: ServiceAccount
metadata:
  name: cassandra-cluster-node
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: casskop-cluster-node-{{ .Namespace }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Namespace }}
    name: casskop-cluster-node
roleRef:
  kind: ClusterRole
  name: casskop-cluster-node
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cassandra-allow-all-ingress
spec:
  podSelector:
    matchLabels:
      app: cassandracluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8778
        - protocol: TCP
          port: 9042
        - protocol: TCP
          port: 7199
        - protocol: TCP
          port: 7000  # Internode
        - protocol: TCP
          port: 7001  # Internode SSL
---
apiVersion: db.orange.com/v2
kind: CassandraCluster
metadata:
  name: cassandra-e2e
spec:
  nodesPerRacks: 1
  cassandraImage: cassandra:4.0.2
  serverVersion: 4.0.0
  config:
    jvm-options:
      initial_heap_size: 32M
      max_heap_size: 256M
  deletePVC: true
  autoPilot: true
  backRestSidecar:
    resources:
      limits:
        memory: 128Mi
        cpu: 100m
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
  topology:
    dc:
      - name: dc1
        rack:
          - name: rack1