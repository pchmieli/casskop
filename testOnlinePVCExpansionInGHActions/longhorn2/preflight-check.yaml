apiVersion: v1
kind: Pod
metadata:
  name: longhorn-preflight-check
  namespace: kube-system
spec:
  hostPID: true
  hostNetwork: true
  containers:
    - name: checker
      image: alpine:3.19
      command:
        - sh
        - -c
        - |
          echo "=== Longhorn Environment Check ==="
          
          echo -e "\n1. Checking iscsiadm..."
          nsenter --mount=/proc/1/ns/mnt iscsiadm --version || exit 1
          
          echo -e "\n2. Checking mount utilities..."
          nsenter --mount=/proc/1/ns/mnt mount --version || exit 1
          nsenter --mount=/proc/1/ns/mnt mkfs.ext4 -V || exit 1
          
          echo -e "\n3. Checking required paths..."
          nsenter --mount=/proc/1/ns/mnt ls -la /var/lib/longhorn 2>/dev/null || \
            nsenter --mount=/proc/1/ns/mnt mkdir -p /var/lib/longhorn
          
          echo -e "\n4. Checking iSCSI initiator..."
          if ! nsenter --mount=/proc/1/ns/mnt cat /etc/iscsi/initiatorname.iscsi 2>/dev/null; then
            echo "iqn.2024-01.io.longhorn:$(hostname)" | \
              nsenter --mount=/proc/1/ns/mnt tee /etc/iscsi/initiatorname.iscsi
          fi
          
          echo -e "\n5. All checks passed! Ready for Longhorn installation."
          sleep 3600
      securityContext:
        privileged: true
  restartPolicy: Never